
name: Main Branch Protection

on:
  pull_request_target:
    branches:
      - main

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch
        run: |
          if [[ "${GITHUB_HEAD_REF}" != "acceptance" ]]; then
            echo "Error: Pull request must come from 'acceptance'"
            exit 1
          fi
