name: Main Branch Protection

# Runs from the workflow file on main (pull_request_target), so a PR can't
# change this check. It doesn't check out or run PR code.
on:
  pull_request_target:
    branches:
      - main
    # "edited" re-runs the check when someone changes a PR's base to main.
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  check-branch:
    name: source-is-acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Only allow PRs from acceptance in this repo
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REF" != "acceptance" || "$HEAD_REPO" != "$THIS_REPO" ]]; then
            echo "::error::PRs into main must come from '$THIS_REPO:acceptance' (got '$HEAD_REPO:$HEAD_REF')."
            exit 1
          fi
